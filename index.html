<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lusion AI: all in one AI platform for weight lifters and coaches</title>
    <meta name="description" content="All in one AI platform for weight lifters and coaches." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Inter is the fallback for devices without SF Pro (Windows, Android) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/home.css" />
  </head>
  <body>
    <header id="navbar"></header>

    <main>
      <section class="hero">
        <h1>
          <span class="line">All in One <span class="accent">AI</span></span>
          <span class="line"><span class="accent">Platform</span> for</span>
          <span class="line">Weight Lifters</span>
          <span class="line">&amp; Coaches</span>
        </h1>

        <!-- Hero panel: public/images/hero-panel.png (or .svg, then change the extension here) -->
        <img
          class="hero-panel"
          src="/images/hero-panel.png"
          width="522"
          height="391"
          decoding="async"
          fetchpriority="high"
          alt="Lusion AI preview: Train Mode with a progress bar, a coaching message and a chat box"
        />
      </section>
    </main>

    <script type="module" src="/src/nav-init.js"></script>
  </body>
</html>
