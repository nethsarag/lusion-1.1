<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in | Lusion AI</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/pages.css" />
  </head>
  <body class="login-page">
    <header id="navbar"></header>
    <main class="login-main">
      <section class="auth login-card" aria-labelledby="login-title">
        <h1 id="login-title">LOG IN</h1>
        <form id="auth-form" data-next="login" novalidate>
          <label class="sr" for="email">Email</label>
          <input id="email" name="email" type="email" required autocomplete="email" placeholder="Enter Your Email" />
          <label class="sr" for="password">Password</label>
          <input id="password" name="password" type="password" required autocomplete="current-password" minlength="8" placeholder="Enter Your Password" />
          <input id="role" name="role" type="hidden" value="lifter" />
          <p id="form-error" class="error" role="alert"></p>
          <button class="btn login-google" type="submit">Continue with Google</button>
        </form>
      </section>
    </main>
    <script type="module" src="/src/nav-init.js"></script>
    <script type="module" src="/src/auth.js"></script>
  </body>
</html>
